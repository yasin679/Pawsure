<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pawsure pitch</title>
<!-- A minimal pitch film, 1920 x 1080. Every frame is drawn by render(t) (t in seconds), so render.mjs can step
     through it frame by frame and hand the frames to ffmpeg. Open it in a browser to watch it play live. -->
<style>
  :root{--bg:#F8F6ED;--ink:#253128;--ink2:#5E6B57;--sage:#587539;--line:#E4DFCF}
  *{box-sizing:border-box;margin:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,'Inter Display',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .el{position:absolute;opacity:0;will-change:transform,opacity}
  .h{font-family:'Inter Display',Inter,sans-serif;font-weight:700;letter-spacing:-.025em;line-height:1.05}
  .xl{font-size:104px}.l{font-size:68px}.m{font-size:34px;font-weight:500;color:var(--ink2);line-height:1.4;letter-spacing:-.005em}
  .k{font-size:20px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--sage)}
  .accent{color:var(--sage)}
  .phone{height:860px;width:auto;filter:drop-shadow(0 40px 60px rgba(37,49,40,.18))}
  .phone.app{border-radius:14.7% / 6.95%}
  .phone.wa{border-radius:14.4% / 6.85%}
  .rule{height:2px;background:var(--sage);width:0}
  /* infographics */
  .tl{width:600px;font-size:20px;font-weight:600;color:var(--ink2)}
  .tl .track{position:relative;height:14px;border-radius:7px;background:var(--line);margin:18px 0 14px}
  .tl .alone{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--sage);opacity:.85}
  .tl .visit{position:absolute;top:-17px;width:48px;height:48px;margin-left:-24px;border-radius:50%;background:var(--bg);border:3px dashed var(--ink2);display:grid;place-items:center;font:700 24px Inter;color:var(--ink2)}
  .tl .ends{display:flex;justify-content:space-between}
  .tl .cap{margin-top:34px;font-size:22px;color:var(--ink)}
  .tl .big{font:700 64px 'Inter Display',Inter;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px}
  .dots{display:grid;grid-template-columns:repeat(9,28px);gap:10px}
  .dots i{width:28px;height:28px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--sage)}
  .dots.warn i.on{background:#C8742F}
  .chips{display:flex;gap:14px}
  .chip{border:2px solid var(--line);border-radius:18px;padding:14px 18px;min-width:210px;background:#fff}
  .chip b{display:flex;align-items:center;gap:10px;font-size:22px}
  .chip b::before{content:'';width:14px;height:14px;border-radius:50%;background:var(--c)}
  .chip span{display:block;margin-top:4px;font-size:17px;color:var(--ink2);font-weight:500}
  .steps{display:flex;align-items:center;gap:14px}
  .step{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:600}
  .step em{font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:700;flex:none}
  .arrow{color:var(--ink2);font-size:26px}
  .stats{display:flex;gap:72px;text-align:center}
  .stat b{display:block;font:700 54px 'Inter Display',Inter;letter-spacing:-.02em;color:var(--ink)}
  .stat span{font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
  .gaps{display:flex;gap:22px}
  .gap{width:300px;border-top:3px solid var(--sage);padding-top:16px}
  .gap b{display:block;font:700 30px 'Inter Display',Inter;letter-spacing:-.01em}
  .gap span{display:block;margin-top:6px;font-size:21px;color:var(--ink2);font-weight:500;line-height:1.35}
  .grid{border-collapse:collapse;width:1520px;font-size:21px}
  .grid th{font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);text-align:center;padding:0 10px 14px}
  .grid td{border-top:1.5px solid var(--line);padding:14px 10px;text-align:center}
  .grid td:first-child{text-align:left;width:520px}
  .grid td b{display:block;font-size:23px}.grid td span{display:block;font-size:17px;color:var(--ink2);margin-top:2px}
  .grid tr.us td{background:#EEF2E4;border-top:2px solid var(--sage)}
  .grid tr.us td:first-child{border-radius:14px 0 0 14px}.grid tr.us td:last-child{border-radius:0 14px 14px 0}
  i.no,i.yes{font-style:normal;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:800}
  i.no{color:#B9B3A3;background:#F1EDE2}i.yes{color:#fff;background:var(--sage)}
  .vs{display:grid;gap:14px;font-size:26px}
  .vs div{display:grid;grid-template-columns:420px 50px 460px;align-items:center}
  .vs span{text-align:right;color:var(--ink2);text-decoration:line-through;text-decoration-color:rgba(94,107,87,.45)}
  .vs b{text-align:center;color:var(--sage)}.vs em{font-style:normal;font-weight:700}
  .road{display:flex;gap:22px}
  .ph{width:490px;border:2px solid var(--line);border-radius:22px;padding:24px 26px;background:#fff}
  .ph.now{border-color:var(--sage);box-shadow:0 0 0 4px rgba(88,117,57,.12)}
  .ph i{font-style:normal;font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sage)}
  .ph b{display:block;font:700 38px 'Inter Display',Inter;letter-spacing:-.02em;margin:10px 0 8px}
  .ph span{font-size:20px;color:var(--ink2);line-height:1.4;font-weight:500}
  .years{display:flex;align-items:center;gap:26px;font-size:22px;color:var(--ink2);font-weight:500}
  .years b{color:var(--ink);margin-right:10px}.years i{font-style:normal;color:var(--sage);font-weight:700}
  .jobs{display:flex;gap:56px;font-size:22px;color:var(--ink2);font-weight:500}
  .jobs b{display:block;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);margin-bottom:6px}
  .who{display:flex;align-items:center;gap:36px}
  .av{position:relative;width:200px;height:200px;border-radius:50%;background:#EDE6F6;display:grid;place-items:center;flex:none}
  .av img{width:200px;height:200px;border-radius:50%}
  .av img.pet{position:absolute;right:-30px;bottom:-14px;width:96px;height:96px;background:#F2C14E;border:5px solid var(--bg)}
  .av.two{width:330px;background:none}.av.two img{position:absolute;top:0}.av.two img:first-child{left:0}.av.two img:last-child{left:130px;border:6px solid var(--bg);box-sizing:content-box;top:-6px}
  .pn{display:flex;gap:28px}
  .pn > div{width:440px;border-top:3px solid var(--sage);padding-top:16px}
  .pn i{font-style:normal;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
  .pn p{font-size:27px;font-weight:600;line-height:1.35;margin-top:8px;color:var(--ink)}
  .think{font:700 44px 'Inter Display',Inter;letter-spacing:-.02em;color:var(--ink2);background:#fff;border:2px solid var(--line);border-radius:36px 36px 36px 8px;padding:22px 34px}
  .bars{display:grid;gap:26px;width:1460px}
  .bar{display:grid;grid-template-columns:520px 1fr 120px 130px;align-items:center;gap:24px;font-size:26px;font-weight:600}
  .bar .track{height:22px;border-radius:11px;background:var(--line);overflow:hidden}
  .bar .fillb{display:block;height:100%;border-radius:11px;background:var(--sage);width:0}
  .bar b{font:700 40px 'Inter Display',Inter;letter-spacing:-.02em;text-align:right}
  .bar em{font-style:normal;font-size:19px;color:var(--ink2);font-weight:500}
  .bar.dim{color:var(--ink2)}.bar.dim .fillb{background:#B9C7A2}
  .p0{display:grid;grid-template-columns:repeat(2,750px);gap:22px}
  .p0 > div{border:2px solid var(--line);border-radius:22px;background:#fff;padding:24px 28px 26px 96px;position:relative;min-height:190px}
  .p0 i{position:absolute;left:26px;top:26px;width:50px;height:50px;border-radius:14px;background:#EEF2E4;color:var(--sage);display:grid;place-items:center;font-style:normal;font-size:26px;font-weight:700}
  .p0 b{display:block;font:700 32px 'Inter Display',Inter;letter-spacing:-.015em;margin:4px 0 10px}
  .p0 p{font-size:21px;line-height:1.45;color:var(--ink2);font-weight:500}
  .notp0{font-size:20px;font-weight:600;color:var(--ink2);display:flex;gap:18px;align-items:center}
  .notp0 span{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#C8742F;font-weight:700;margin-right:6px}
  .plays{display:flex;gap:26px}
  .plays > div{width:480px;border:2px solid var(--line);border-radius:24px;background:#fff;padding:30px}
  .plays.two > div{width:640px}
  .plays i{font-style:normal;width:52px;height:52px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;margin-bottom:20px}
  .plays b{display:block;font:700 30px 'Inter Display',Inter;letter-spacing:-.015em;margin-bottom:10px;line-height:1.15}
  .plays p{font-size:21px;color:var(--ink2);line-height:1.45;font-weight:500}
  .card{width:520px;background:#fff;border-radius:34px;padding:36px 40px;box-shadow:0 40px 70px -30px rgba(37,49,40,.35);border:1px solid var(--line)}
  .card .ct{display:flex;align-items:center;gap:18px}.card .ct img{width:76px;height:76px;border-radius:50%;background:#F2C14E}
  .card .ct b{display:block;font:700 30px 'Inter Display',Inter}.card .ct span{font-size:19px;color:var(--ink2)}
  .big2{font:800 150px/1 'Inter Display',Inter;letter-spacing:-.04em;margin-top:34px;color:var(--ink)}.big2 .num{color:var(--sage)}
  .card .cl{font-size:26px;font-weight:600;color:var(--ink2);margin-top:6px}
  .week{display:flex;gap:10px;margin:30px 0}.week i{flex:1;height:14px;border-radius:7px;background:var(--line)}.week i.on{background:var(--sage)}
  .cf{display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid var(--line);padding-top:20px}.cf img{height:34px}.cf span{font-size:16px;color:var(--ink2)}
  .xs-note{font-size:16px;color:var(--ink2);letter-spacing:.1em;text-transform:uppercase}
  .loop{font-size:21px;font-weight:600;color:var(--ink)}.loop i{font-style:normal;color:var(--sage);margin:0 8px}
  .pawly{position:relative;display:flex;align-items:center;gap:22px}
  .pawly img{position:relative;width:112px;height:112px;border-radius:50%;box-shadow:0 14px 30px -12px rgba(110,70,190,.55)}
  .pawly .ring{position:absolute;left:0;top:0;width:112px;height:112px;border-radius:50%;background:#8A5CD8}
  .pawly b{display:block;font:700 40px 'Inter Display',Inter;letter-spacing:-.02em;color:#5B3AA6}
  .pawly div span{font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8A5CD8}
  .pv{color:#6E46C2}
  .bubble{display:flex;align-items:flex-start;gap:14px;width:420px;background:#fff;border:2px solid #E4D9F6;border-radius:26px 26px 26px 6px;padding:18px 22px;font-size:21px;font-weight:600;line-height:1.4;box-shadow:0 20px 40px -24px rgba(91,58,166,.45)}
  .bubble img{width:40px;height:40px;border-radius:50%;flex:none}
  #progress{position:absolute;left:0;bottom:0;height:4px;background:var(--sage);opacity:.35}
</style>
</head>
<body>
<div id="stage"></div>
<script src="timing.js" onerror=""></script>
<div id="progress"></div>
<script>
const A = '../../apps/web/public/assets/', S = 'shots/';
// One entry per element: when it comes in and goes out (seconds), where it sits, and how it moves.
// in/out are fades with a short slide (dy pixels); 'zoom' adds a slow push-in while it is on screen.
const scenes = [];
// dot grids fill one dot at a time over `secs` seconds
const fill = secs => (dt, n) => { const g = n.querySelector('.dots'), k = Math.round(+g.dataset.n * Math.min(1, Math.max(0, (dt - .5) / secs)));
  g.querySelectorAll('i').forEach((d, j) => d.classList.toggle('on', j < k)); };
const T = (html, x, y, a, b, o = {}) => scenes.push({ html, x, y, a, b, ...o });
const P = (src, kind, x, y, a, b, o = {}) => T(`<img class="phone ${kind}" src="${S + src}.png">`, x, y, a, b, { dy: 40, ...o });

// Scene start times (seconds), set from the voice-over by timing.js; the last entry is the end of the film.
const TIMES = window.PITCH_TIMES;
const at = (n, off = 0) => TIMES[n] + off, end = n => TIMES[n + 1];
const L = (n, k, h, m, o = {}) => { // the left column: kicker, headline, line
  T(`<div class="k">${k}</div>`, 200, 380, at(n, .2), end(n), o);
  T(`<div class="h l">${h}</div>`, 200, 440, at(n, .5), end(n), o);
  if (m) T(`<div class="m">${m}</div>`, 200, 650, at(n, 1.6), end(n), o);
};
const X = '<i class="no">✕</i>', V = '<i class="yes">✓</i>';
const PPL = A + 'people/', PET = A + 'avatars/';
// reveal the children matching `sel` at the given offsets (seconds after the element appears)
const stagger = (sel, offs, dx = 0) => (dt, n) => n.querySelectorAll(sel).forEach((g, j) => { const p = Math.min(1, Math.max(0, (dt - (offs[j] ?? offs[offs.length - 1])) / .5)); g.style.opacity = p; g.style.transform = `translate(${(1 - p) * dx}px, ${(1 - p) * (dx ? 0 : 12)}px)`; });
const persona = (n, img, name, role, pain, need, extra = '', offs = [0, 1.6, 3]) => {
  T(`<div class="who"><div class="av">${img}</div><div><div class="k">${role}</div><div class="h l">${name}</div></div></div>`, 200, 330, at(n, .2), end(n));
  T(`<div class="pn"><div><i>Pain point</i><p>${pain}</p></div><div><i>What she needs</i><p>${need}</p></div>${extra}</div>`, 200, 620, at(n, 1.4), end(n), { tick: stagger('.pn > div', offs) });
};

// 0. Name and promise
T(`<img src="${A}pawsure-logo.png" style="height:120px">`, 960, 470, at(0, .3), end(0), { center: true, dy: 0, zoom: .03 });
T(`<div class="m" style="text-align:center">Be sure, whoever’s caring.</div>`, 960, 600, at(0, 1.1), end(0), { center: true });

// 1. The job to be done
T(`<div class="k" style="text-align:center">The real job</div>`, 960, 330, at(1, .1), end(1), { center: true });
T(`<div class="h l" style="text-align:center;max-width:1400px">“When I’m away, help me know my pet<br>is cared for <span class="accent">as planned</span>”</div>`, 960, 400, at(1, .3), end(1), { center: true });
T(`<div class="jobs"><span><b>Functional</b>Know each task was done</span><span><b>Emotional</b>Calm, no guilt about being away</span><span><b>Social</b>Trust without micromanaging</span></div>`, 960, 640, at(1, 1.4), end(1), { center: true, tick: stagger('.jobs span', [0, .5, 1]) });

// 2–4. Who we're designing for
persona(2, `<img src="${PPL}bob-glasses.webp"><img class="pet" src="${PET}dog.webp">`, 'Neha, 34', 'Primary owner · out 8–10 hours', 'Can’t tell if lunch, water and the walk actually happened', 'One honest status for the day', '', [4.8, 6.2]);
T(`<div class="think">“Is Bruno okay?”</div>`, 1250, 370, at(2, 2.2), end(2));
persona(3, `<img src="${PPL}bun-hoops.webp">`, 'Sunita, 45', 'Her helper · three flats', 'Apps, typing, and being blamed for honest mistakes', 'A simple request in her language, no app', `<div><i>How she works</i><p>WhatsApp and voice notes · Hindi or Marathi · sometimes a basic phone</p></div>`, [5, 6.6, 1.2]);
T(`<div class="think">“Will I be blamed?”</div>`, 1250, 370, at(3, 8.4), end(3));
T(`<div class="who"><div class="av two"><img src="${PPL}beard-glasses.webp"><img src="${PPL}curls-headphones.webp"></div><div><div class="k">Secondary owners · new to the city</div><div class="h l">Rohan &amp; Ankita</div></div></div>`, 200, 330, at(4, .2), end(4));
T(`<div class="pn"><div><i>Pain point</i><p>No one they trust nearby when they travel or work late</p></div><div><i>What they need</i><p>A trusted care circle in their own society</p></div></div>`, 200, 620, at(4, 1.4), end(4), { tick: stagger('.pn > div', [0, 1.4]) });

// 5. The three gaps
T(`<div class="k">The problem</div>`, 200, 300, at(5, .1), end(5));
T(`<div class="h l">For most pet parents,<br>care is a guess</div>`, 200, 360, at(5, .3), end(5));
T(`<div class="gaps"><div class="gap"><b>No shared plan</b><span>Instructions scattered across chats</span></div><div class="gap"><b>No signal</b><span>Nothing tells you a task was done</span></div><div class="gap"><b>No backup</b><span>When the helper can’t come</span></div></div>`, 200, 600, at(5, 1.6), end(5), { tick: stagger('.gap', [2.4, 3.8, 6.2]) });
T(`<div class="tl"><div class="big">2–8 hours</div>alone at home, on a working day<div class="track"><div class="alone"></div><div class="visit">?</div></div><div class="ends"><span>Leave · 9 AM</span><span>Back · 7 PM</span></div></div>`, 1200, 330, at(5, .8), end(5), {
  tick: (dt, n) => { const p = Math.min(1, Math.max(0, (dt - .4) / 2.2)); n.querySelector('.alone').style.width = (p * 100) + '%';
    const v = n.querySelector('.visit'); v.style.left = '40%'; v.style.opacity = Math.min(1, Math.max(0, (dt - 2.6) / .6)); } });

// 6. The research, headline numbers
T(`<div class="k">From our primary research and survey</div>`, 200, 300, at(6, .1), end(6));
T(`<div class="h xl accent">80%</div>`, 200, 360, at(6, 3.4), end(6));
T(`<div class="m">leave their pet alone<br>at least sometimes</div>`, 200, 490, at(6, 3.7), end(6));
T(`<div class="dots" data-n="36">${'<i></i>'.repeat(45)}</div>`, 200, 640, at(6, 3.9), end(6), { tick: fill(1.6) });
T(`<div class="h xl" style="color:#C8742F">16%</div>`, 1000, 360, at(6, 6.7), end(6));
T(`<div class="m">came home to find<br>something wrong</div>`, 1000, 490, at(6, 7), end(6));
T(`<div class="dots warn" data-n="7">${'<i></i>'.repeat(45)}</div>`, 1000, 640, at(6, 7.2), end(6), { tick: fill(.6) });

// 7. The research, how they cope
T(`<div class="k">How pet parents cope today</div>`, 200, 200, at(7, .1), end(7));
T(`<div class="h l">Everyone is improvising</div>`, 200, 255, at(7, .3), end(7));
const barRow = (pct, label, n, hi) => `<div class="bar${hi ? '' : ' dim'}"><span class="lbl">${label}</span><span class="track"><span class="fillb" data-p="${pct}"></span></span><b>${pct}%</b><em>${n} of 45</em></div>`;
T(`<div class="bars">${barRow(62, 'Rely on someone else to check', 28, 1)}${barRow(69, 'Changed plans because of their pet', 31, 1)}${barRow(42, 'Use a pet camera', 19, 1)}${barRow(40, 'Have paid for pet care', 18)}</div>`, 200, 420, at(7, .6), end(7), {
  tick: (dt, n) => n.querySelectorAll('.bar').forEach((r, j) => { const p = Math.min(1, Math.max(0, (dt - [0, 2.9, 6.9, 8][j]) / 1)); r.style.opacity = Math.min(1, p * 3); r.querySelector('.fillb').style.width = (+r.querySelector('.fillb').dataset.p * (1 - Math.pow(1 - p, 3))) + '%'; }) });
T(`<div class="m" style="color:var(--ink)">A camera can watch. <b>It can’t help.</b></div>`, 200, 830, at(7, 9.4), end(7));

// 8. The landscape: everyone solves a slice
T(`<div class="k">Pet care today is fragmented</div>`, 200, 170, at(8, .1), end(8));
T(`<div class="h l">Today’s options solve slices</div>`, 200, 225, at(8, .3), end(8));
T(`<table class="grid"><thead><tr><th></th><th>Book care</th><th>Watch</th><th>Proof care happened</th><th>Backup if plans fail</th></tr></thead><tbody>
  <tr><td><b>Care marketplaces</b><span>PetBacker · ThePetNest</span></td><td>${V}</td><td>${X}</td><td>${X}</td><td>${X}</td></tr>
  <tr><td><b>Sitting &amp; boarding</b><span>Rover · Wag! · TrustedHousesitters · PawSpace</span></td><td>${V}</td><td>${X}</td><td>${X}</td><td>${X}</td></tr>
  <tr><td><b>Pet cameras</b><span>Furbo · Petcube</span></td><td>${X}</td><td>${V}</td><td>${X}</td><td>${X}</td></tr>
  <tr><td><b>Friends &amp; helpers</b><span>Informal care</span></td><td>${X}</td><td>${X}</td><td>${X}</td><td>${X}</td></tr>
  <tr class="us"><td><b>Pawsure</b><span>Your own helper, assured</span></td><td>–</td><td>–</td><td>${V}</td><td>${V}</td></tr></tbody></table>`, 200, 370, at(8, 1), end(8), { tick: stagger('tbody tr', [2, 2.5, 4, 4.6, 6]) });

// 9. The difference
T(`<div class="k" style="text-align:center">The difference</div>`, 960, 300, at(9, .1), end(9), { center: true });
T(`<div class="h l" style="text-align:center">Others help you <span style="color:var(--ink2)">book</span> care<br>Pawsure assures it <span class="accent">happened</span></div>`, 960, 360, at(9, .3), end(9), { center: true });
T(`<div class="vs"><div><span>A booking, then silence</span><b>→</b><em>Proof of care</em></div><div><span>Scattered chats</span><b>→</b><em>One shared routine</em></div><div><span>Helpers must learn an app</span><b>→</b><em>WhatsApp, in her language</em></div><div><span>No fallback</span><b>→</b><em>Cover when help can’t come</em></div></div>`, 960, 590, at(9, 1.8), end(9), { center: true, tick: stagger('.vs > div', [0, .5, 1, 1.5]) });

// 10–14. The product

const DURATION = TIMES[TIMES.length - 1];
const stage = document.getElementById('stage'), bar = document.getElementById('progress');
for (const s of scenes) {
  const d = document.createElement('div'); d.className = 'el'; d.innerHTML = s.html; stage.appendChild(d); s.node = d;
  if (s.h) d.querySelector('img').style.height = s.h + 'px';
}
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const easeIn = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x;
window.render = t => {
  for (const s of scenes) {
    const IN = .8, OUT = .5, dy = s.dy ?? 24;
    const i = ease((t - s.a) / IN), o = s.hold ? 0 : easeIn((t - (s.b - OUT)) / OUT);
    const op = Math.max(0, i - o);
    const n = s.node; n.style.opacity = op; n.style.visibility = op > 0 ? 'visible' : 'hidden';
    if (op <= 0) continue;
    const z = 1 + (s.zoom ?? 0) * Math.min(1, Math.max(0, (t - s.a) / (s.b - s.a)));
    const ty = (1 - i) * dy - o * 12;
    const w = n.offsetWidth;
    n.style.left = (s.center ? s.x - w / 2 : s.x) + 'px'; n.style.top = s.y + 'px';
    n.style.transform = `translateY(${ty}px) scale(${z})`;
    if (s.tick) s.tick(t - s.a, n);
  }
  bar.style.width = (t / DURATION * 100) + '%';
};
window.DURATION = DURATION;
window.ready = Promise.all([...document.images].map(im => im.decode().catch(() => {}))).then(() => document.fonts.ready);
// Live preview when opened directly (render.mjs passes ?frames to drive it itself)
if (!location.search.includes('frames')) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; window.ready.then(loop); }
