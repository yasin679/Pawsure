<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#587539">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<title>Pawsure Demo</title>
<style id="splash-css">
/* Shown by the HTML itself, before any script loads; the app removes it once the first screen is ready (at least 1.5 s). */
#splash{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#587539 0%,#6F8F4E 38%,#A9BE8C 72%,#F1E6C4 100%);font-family:Nunito,system-ui,sans-serif;color:#FBF8EF;transition:opacity .45s ease,transform .45s ease}
#splash .sp{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:24px}
#splash .mark{width:92px;height:92px;animation:sp-pop .7s cubic-bezier(.2,1.4,.4,1) both}
#splash .word{font:800 52px/1 'Baloo 2',Nunito,system-ui,sans-serif;letter-spacing:.01em;margin-top:10px;animation:sp-up .6s ease-out .15s both}
#splash .sp-tag{font-size:17px;font-weight:700;margin:0;opacity:.9;animation:sp-up .6s ease-out .3s both}
#splash .note{position:absolute;bottom:28px;left:0;right:0;font-size:13px;font-weight:700;color:#3F4F33;margin:0;padding:0 24px}
#splash i.dot{position:absolute;border-radius:50%;background:#FBF8EF;opacity:.75;animation:sp-drift 6s ease-in-out infinite}
#splash i.ring{position:absolute;border-radius:50%;border:1.5px solid #FBF8EF;opacity:.6;animation:sp-drift 7s ease-in-out infinite reverse}
#splash.gone{opacity:0;transform:scale(1.03);pointer-events:none}
@keyframes sp-pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes sp-up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes sp-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash{transition:none}}
</style>
</head>
<body>
<div id="demo-boot" class="offline" hidden></div>
<div id="splash" role="status" aria-live="polite" aria-label="Pawsure is loading"><i class="dot" style="width:10px;height:10px;left:14%;top:18%"></i><i class="dot" style="width:6px;height:6px;right:20%;top:30%"></i><i class="ring" style="width:22px;height:22px;left:22%;top:64%"></i><i class="dot" style="width:8px;height:8px;right:16%;top:72%;animation-delay:1s"></i><i class="ring" style="width:30px;height:30px;right:12%;top:12%;animation-delay:.6s"></i>
<div class="sp">
  <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><g fill="#FBF8EF"><ellipse cx="11" cy="17" rx="4.2" ry="5.4" transform="rotate(-18 11 17)"/><ellipse cx="19.5" cy="9.5" rx="4.4" ry="5.6"/><ellipse cx="28.5" cy="9.5" rx="4.4" ry="5.6"/><ellipse cx="37" cy="17" rx="4.2" ry="5.4" transform="rotate(18 37 17)"/></g><path d="M24 21c-7.5 0-13 6.3-13 12.6C11 39.8 16.6 43 24 43s13-3.2 13-9.4C37 27.3 31.5 21 24 21z" fill="none" stroke="#FBF8EF" stroke-width="3.4"/><path d="M24 38.5s-6-3.6-6-7.4a3.2 3.2 0 0 1 6-1.6 3.2 3.2 0 0 1 6 1.6c0 3.8-6 7.4-6 7.4z" fill="#F2C14E"/></svg>
  <div class="word">Pawsure</div>
  <p class="sp-tag">Be sure, whoever’s caring.</p>
</div>
  <p class="note" id="splash-note">Starting the demo. The first visit takes a few seconds.</p></div>
<script>/* failsafe: never leave the splash up if the app fails to start */setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('gone');setTimeout(function(){s.remove()},300)}},45000)</script>
<div id="root"></div>
<script type="module" src="/src/demo/main.ts"></script>
</body>
</html>
