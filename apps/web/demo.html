<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC400">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<title>Pawsure Demo</title>
<style id="splash-css">
/* Shown by the HTML itself, before any script loads; the app removes it once the first screen is ready (at least 1.5 s). */
#splash{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#FFE27A 0,#FFC400 55%,#F5B400 100%);font-family:Nunito,system-ui,sans-serif;color:#20201D;transition:opacity .4s ease,transform .4s ease}
#splash .sp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 16px;box-sizing:border-box;text-align:center;max-width:420px}
#splash .halo{width:220px;height:220px;border-radius:50%;background:#FFFDF0;border:3px solid #20201D;box-shadow:0 10px 0 rgba(32,32,29,.18),0 0 0 14px rgba(255,253,240,.35);display:grid;place-items:center;animation:sp-pop .6s cubic-bezier(.2,1.4,.4,1) both}
#splash img{width:178px;height:auto;animation:sp-bob 2.4s ease-in-out .6s infinite}
#splash .word{font:800 48px/1 'Baloo 2',Nunito,system-ui,sans-serif;letter-spacing:.01em;margin-top:14px;animation:sp-up .5s ease-out .15s both}
#splash .sp-tag{font-size:18px;font-weight:800;margin:0;opacity:.85;animation:sp-up .5s ease-out .3s both}
#splash .dots{display:flex;gap:9px;margin-top:18px}
#splash .dots i{width:12px;height:12px;border-radius:50%;background:#20201D;animation:sp 1.1s ease-in-out infinite}
#splash .dots i:nth-child(2){animation-delay:.15s}#splash .dots i:nth-child(3){animation-delay:.3s}
#splash .note{font-size:13px;font-weight:700;color:#3b3200;margin:6px 0 0;min-height:1.3em;max-width:300px}
#splash.gone{opacity:0;transform:scale(1.04);pointer-events:none}
@keyframes sp{0%,80%,100%{transform:scale(.55);opacity:.45}40%{transform:scale(1);opacity:1}}
@keyframes sp-pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes sp-up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes sp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash{transition:none}}
</style>
</head>
<body>
<div id="demo-boot" class="offline" hidden></div>
<div id="splash" role="status" aria-live="polite" aria-label="Pawsure is loading"><div class="sp">
  <div class="halo"><img src="./assets/mascot-family.png" alt="" width="180" height="148"></div>
  <div class="word">Pawsure</div>
  <p class="sp-tag">Be sure, whoever’s caring.</p>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="note" id="splash-note">Starting the demo in your browser. The first visit can take a few seconds.</p>
</div></div>
<script>/* failsafe: never leave the splash up if the app fails to start */setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('gone');setTimeout(function(){s.remove()},300)}},45000)</script>
<div id="root"></div>
<script type="module" src="/src/demo/main.ts"></script>
</body>
</html>
