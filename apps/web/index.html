<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#587539">
<meta name="description" content="Pawsure — be sure, whoever’s caring.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<title>Pawsure</title>
<style id="splash-css">
/* Shown by the HTML itself, before any script loads; the app removes it once the first screen is ready.
   The vertical Pawsure logo over a soft, slowly moving gradient in the palette (sage, honey, apricot on warm ivory). */
#splash{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#F8F6ED;font-family:Nunito,system-ui,sans-serif;color:#253128;transition:opacity .8s ease,transform .8s ease}
#splash::before{content:"";position:absolute;inset:-40%;background:radial-gradient(40% 35% at 30% 30%,rgba(117,150,79,.28),transparent 70%),radial-gradient(38% 32% at 72% 38%,rgba(233,199,94,.30),transparent 70%),radial-gradient(42% 36% at 50% 75%,rgba(230,161,92,.24),transparent 70%),radial-gradient(30% 28% at 20% 80%,rgba(169,197,176,.30),transparent 70%);filter:blur(10px);animation:sp-flow 9s ease-in-out infinite alternate}
#splash .sp{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
#splash .logo{width:min(190px,48vw);height:auto;animation:sp-in .8s cubic-bezier(.2,.9,.3,1) both}
#splash .sp-tag{font-size:16px;font-weight:700;margin:0;color:#3F4F33;animation:sp-in .8s ease-out .2s both}
#splash .bar{position:relative;width:120px;height:4px;border-radius:4px;background:rgba(37,49,40,.10);overflow:hidden;margin-top:6px}
#splash .bar::after{content:"";position:absolute;inset:0;width:45%;border-radius:4px;background:linear-gradient(90deg,#75964F,#E9C75E,#E6A15C);animation:sp-bar 1.4s ease-in-out infinite}
#splash .note{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:#3F4F33;margin:0;padding:0 24px}
#splash.gone{opacity:0;transform:scale(1.03);pointer-events:none}
@keyframes sp-flow{0%{transform:translate(-4%,-3%) rotate(0deg) scale(1)}50%{transform:translate(3%,2%) rotate(8deg) scale(1.05)}100%{transform:translate(-2%,4%) rotate(-6deg) scale(1)}}
@keyframes sp-in{from{transform:translateY(10px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes sp-bar{0%{transform:translateX(-110%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#splash *,#splash::before{animation:none!important}#splash{transition:none}}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite" aria-label="Pawsure is loading">
<div class="sp">
  <img class="logo" src="assets/pawsure-logo-vertical.png" width="412" height="295" alt="Pawsure">
  <p class="sp-tag">Be sure, whoever’s caring.</p>
  <span class="bar" aria-hidden="true"></span>
</div>
  <p class="note" id="splash-note"></p></div>
<script>/* failsafe: never leave the splash up if the app fails to start */setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('gone');setTimeout(function(){s.remove()},300)}},45000)</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
