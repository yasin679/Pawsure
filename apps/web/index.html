<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC400">
<meta name="description" content="Pawsure — be sure, whoever’s caring.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<title>Pawsure</title>
<style id="splash-css">
/* Shown by the HTML itself, before any script loads; the app removes it once the first screen has its data. */
#splash{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:#C3BEA8;font-family:Nunito,system-ui,sans-serif;transition:opacity .25s ease}
#splash .sp{width:min(100%,420px);height:100%;background:#FFFDF0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 16px;box-sizing:border-box;text-align:center;color:#20201D}
#splash img{width:180px;height:auto}
#splash .word{font:800 30px/1 'Baloo 2',Nunito,system-ui,sans-serif;letter-spacing:.02em}
#splash .sp-tag{font-size:15px;color:#47463E;margin:0}
#splash .dots{display:flex;gap:8px;margin-top:14px}
#splash .dots i{width:10px;height:10px;border-radius:50%;background:#FFC400;border:1.5px solid #20201D;animation:sp 1.1s ease-in-out infinite}
#splash .dots i:nth-child(2){animation-delay:.15s}#splash .dots i:nth-child(3){animation-delay:.3s}
#splash .note{font-size:13px;color:#6E6A57;margin:4px 0 0;min-height:1.3em;max-width:300px}
#splash.gone{opacity:0;pointer-events:none}
@keyframes sp{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .dots i{animation:none;opacity:.8}#splash{transition:none}}
@media (prefers-color-scheme:dark){#splash{background:#121210}#splash .sp{background:#1A1A17;color:#FFFDF0}#splash .sp-tag{color:#DAD5BF}#splash .note{color:#AAA58D}#splash .dots i{border-color:#FFFDF0}}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite" aria-label="Pawsure is loading"><div class="sp">
  <img src="./assets/mascot-family.png" alt="" width="180" height="148">
  <div class="word">Pawsure</div>
  <p class="sp-tag">Be sure, whoever’s caring.</p>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="note" id="splash-note"></p>
</div></div>
<script>/* failsafe: never leave the splash up if the app fails to start */setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('gone');setTimeout(function(){s.remove()},300)}},45000)</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
